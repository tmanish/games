<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMES — Select a Cabinet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#040a05;
    --ink:#33ff66;        /* neon phosphor green */
    --ink-dim:#1f9c41;    /* dim green */
    --edge:#11401f;       /* faint slot border */
    --scan:rgba(0,0,0,.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'VT323',monospace;
    background:#040a05;
    color:var(--ink);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:22px;
    overflow-x:hidden;
  }
  /* CRT scanlines + faint edge darkening (no glow) */
  body::after{
    content:"";position:fixed;inset:0;z-index:50;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px),
      radial-gradient(120% 120% at 50% 50%, transparent 62%, rgba(0,0,0,.5) 100%);
  }

  .cabinet{width:min(620px,100%);animation:bootup .45s ease both;}
  @keyframes bootup{
    0%{opacity:0;transform:scaleY(.55);filter:brightness(1.6);}
    45%{opacity:1;}
    100%{opacity:1;transform:scaleY(1);filter:brightness(1);}
  }

  .screen{
    position:relative;
    background:#04130a;
    border:2px solid var(--ink-dim);
    border-radius:4px;
    padding:26px 22px 20px;
    box-shadow:inset 0 0 0 1px var(--edge);
    animation:flicker 8s infinite steps(1);
  }
  @keyframes flicker{0%,96%,100%{opacity:1;}97%{opacity:.88;}98%{opacity:1;}99%{opacity:.93;}}

  .marquee{text-align:center;margin-bottom:6px;}
  .title{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(20px,6vw,34px);
    letter-spacing:.14em;color:var(--ink);line-height:1.4;
  }
  .title .cur{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .subtitle{
    font-size:clamp(16px,4vw,22px);letter-spacing:.3em;
    color:var(--ink-dim);margin-top:10px;text-transform:uppercase;
  }
  .rule{height:0;margin:16px 0 18px;border-top:2px dotted var(--ink-dim);}

  .menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .entry{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border:1px solid var(--edge);border-radius:3px;
    cursor:pointer;background:transparent;
    transition:background .08s,border-color .08s;
  }
  .entry .cursor{
    font-family:'Press Start 2P',monospace;font-size:13px;width:18px;
    color:var(--ink);opacity:0;
  }
  .entry .icon{font-size:30px;width:40px;text-align:center;color:var(--ink);line-height:1;}
  .entry .label{flex:1;min-width:0;}
  .entry .name{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(11px,2.6vw,14px);letter-spacing:.05em;color:var(--ink);line-height:1.5;
  }
  .entry .sub{font-size:clamp(15px,3.4vw,19px);color:var(--ink-dim);letter-spacing:.05em;margin-top:3px;}
  .entry .tag{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.08em;color:var(--ink-dim);white-space:nowrap;}

  /* selected = inverted solid bar (no glow) */
  .entry.sel{background:var(--ink);border-color:var(--ink);}
  .entry.sel .cursor{opacity:1;color:var(--bg);animation:blink 1s steps(1) infinite;}
  .entry.sel .icon,.entry.sel .name,.entry.sel .tag{color:var(--bg);}
  .entry.sel .sub{color:#0a2a14;}

  .entry.locked{cursor:not-allowed;border-color:var(--edge);}
  .entry.locked .icon,.entry.locked .name{color:var(--ink-dim);}
  .entry.locked .sub,.entry.locked .tag{color:#15662a;}

  .footer{margin-top:20px;text-align:center;}
  .start{
    font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.4vw,13px);
    letter-spacing:.1em;color:var(--ink);animation:blink 1.1s steps(1) infinite;
  }
  .hints{display:flex;justify-content:space-between;align-items:center;
    margin-top:14px;font-size:15px;letter-spacing:.06em;color:var(--ink-dim);}
  .hints .k{color:var(--ink);}
  .credit{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--ink);letter-spacing:.06em;}

  @media (prefers-reduced-motion:reduce){
    .cabinet,.screen,.title .cur,.entry.sel .cursor,.start{animation:none;}
    body::after{background:repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);}
  }
</style>
</head>
<body>
  <main class="cabinet">
    <div class="screen">
      <div class="marquee">
        <div class="title">GAMES<span class="cur">_</span></div>
        <div class="subtitle">&gt;&gt; Select a cabinet &lt;&lt;</div>
      </div>
      <div class="rule"></div>

      <ul class="menu" id="menu"></ul>

      <div class="footer">
        <div class="start">&#9654; Press Enter to Play &#9664;</div>
        <div class="hints">
          <span><span class="k">&uarr; &darr;</span> Move &nbsp; <span class="k">&crarr;</span> Start</span>
          <span class="credit" id="credit">Credit 01</span>
        </div>
      </div>
    </div>
  </main>

<script>
"use strict";
// To add a game: drop it in its own folder with an index.html, then add a line here.
const GAMES=[
  { name:'BLACKJACK', sub:'The Velvet Ace - beat the dealer to 21', icon:'\u2660', tag:'CARDS', href:'./blackjack/' },
  { name:'LUCKY SEVENS', sub:'Three-reel slots - line up the sevens', icon:'7', tag:'SLOTS', href:'./lucky-sevens/' },
  { name:'ROULETTE ROYALE', sub:'Single-zero wheel - place your bets', icon:'\uD83C\uDFA1', tag:'WHEEL', href:'./roulette/' },
  { name:'UNIVERSE', sub:'Universe is Listening - random numbers & words', icon:'\u2726', tag:'ORACLE', href:'./universe/' },
  { name:'COMING SOON', sub:'New cabinet powering up', icon:'?', tag:'SOON', href:null, locked:true },
];

const menu=document.getElementById('menu');
const selectable=[];
GAMES.forEach((g,i)=>{
  const li=document.createElement('li');
  li.className='entry'+(g.locked?' locked':'');
  li.dataset.index=i;
  li.innerHTML=
    '<span class="cursor">\u25B6</span>'+
    '<span class="icon">'+g.icon+'</span>'+
    '<span class="label"><div class="name">'+g.name+'</div><div class="sub">'+g.sub+'</div></span>'+
    '<span class="tag">'+(g.locked?'SOON':'PLAY \u25B6')+'</span>';
  menu.appendChild(li);
  if(!g.locked) selectable.push(i);
});

let cur = selectable.length ? selectable[0] : -1;
function paint(){
  [...menu.children].forEach(li=>{
    li.classList.toggle('sel', parseInt(li.dataset.index,10)===cur && !GAMES[cur].locked);
  });
}
function move(dir){
  if(!selectable.length) return;
  let pos=selectable.indexOf(cur);
  pos=(pos+dir+selectable.length)%selectable.length;
  cur=selectable[pos]; paint();
}
function launch(){
  if(cur<0) return;
  const g=GAMES[cur];
  if(g && g.href) window.location.href=g.href;
}

menu.addEventListener('click',e=>{
  const li=e.target.closest('.entry'); if(!li) return;
  const i=parseInt(li.dataset.index,10);
  if(GAMES[i].locked) return;
  cur=i; paint(); launch();
});
menu.addEventListener('mousemove',e=>{
  const li=e.target.closest('.entry'); if(!li) return;
  const i=parseInt(li.dataset.index,10);
  if(GAMES[i].locked || i===cur) return;
  cur=i; paint();
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key==='w'){ e.preventDefault(); move(-1); }
  else if(e.key==='ArrowDown'||e.key==='s'){ e.preventDefault(); move(1); }
  else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); launch(); }
});

document.getElementById('credit').textContent =
  'Credit '+String(selectable.length).padStart(2,'0');
paint();
</script>
</body>
</html>
